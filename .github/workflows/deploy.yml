# Публікація «Норми» на Firebase: сайт (docs/) і правила доступу до бази.
# Запускається сама після кожного оновлення коду, або вручну: Actions → «Публікація на Firebase» → Run workflow.
#
# Потрібно один раз (див. norma/README.md, розділ «Налаштування»):
#   секрет  FIREBASE_SERVICE_ACCOUNT — ключ сервісного акаунта Firebase (JSON) з роллю «Firebase Admin»;
#   змінна  ADMIN_EMAIL              — пошта Google головного адміністратора.
name: Публікація на Firebase

on:
  push:
    branches: [main, claude/worker-norm-calculator-ij740l]
    paths: ['docs/**', 'norma/firestore.rules', 'norma/firestore.indexes.json', 'firebase.json', 'norma/scripts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ключ доступу до Firebase
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Секрет FIREBASE_SERVICE_ACCOUNT ще не додано — публікацію пропущено. Див. norma/README.md"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "project=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != '1'
        with:
          node-version: 20

      - name: Головний адміністратор у правилах доступу
        if: steps.key.outputs.skip != '1'
        env:
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: |
          email=$(printf '%s' "$ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if printf '%s' "$email" | grep -Eq '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$'; then
            sed -i "s/__OWNER_EMAIL__/$email/g" norma/firestore.rules
            echo "Головний адміністратор: $email"
          else
            echo "::warning::Змінну ADMIN_EMAIL не задано або в ній не пошта — головного адміністратора не буде (можна додати документ у колекцію admins вручну)"
          fi

      - name: Налаштування веб-застосунку (config.js)
        if: steps.key.outputs.skip != '1'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PROJECT: ${{ steps.key.outputs.project }}
        run: |
          if ! grep -q 'ВСТАВТЕ_СЮДИ' docs/config.js; then echo "docs/config.js уже заповнено"; exit 0; fi
          fb="npx --yes firebase-tools@15"
          app=$($fb apps:list WEB --project "$PROJECT" --json | jq -r '.result[0].appId // empty')
          if [ -z "$app" ]; then
            app=$($fb apps:create WEB "Норма" --project "$PROJECT" --json | jq -r '.result.appId')
          fi
          $fb apps:sdkconfig WEB "$app" --project "$PROJECT" --json > "$RUNNER_TEMP/sdk.json"
          node norma/scripts/web-config.mjs "$RUNNER_TEMP/sdk.json" docs/config.js

      - name: Публікація
        if: steps.key.outputs.skip != '1'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project "${{ steps.key.outputs.project }}" --non-interactive
          echo "### Опубліковано: https://${{ steps.key.outputs.project }}.web.app" >> "$GITHUB_STEP_SUMMARY"
